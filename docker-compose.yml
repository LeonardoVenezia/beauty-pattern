services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/tejedora.sqlite3
      FAKE_AI: ${FAKE_AI:-1}
    volumes:
      - tejedora-data:/app/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  tejedora-data:
